# Vollständige nginx-Konfiguration; ersetzt /etc/nginx/nginx.conf im Image.
#
# Der Container läuft als Benutzer nginx statt root, ohne Capabilities und mit
# schreibgeschütztem Dateisystem (siehe docker-compose.yml). Dafür:
#   - keine "user"-Zeile (die wirkt nur, wenn nginx als root startet),
#   - PID-Datei und Zwischenspeicher unter /tmp (tmpfs, beschreibbar).
# Port 80 geht trotzdem: Docker erlaubt in Containern seit Version 20.10 jedem
# Benutzer alle Ports (net.ipv4.ip_unprivileged_port_start=0). Die Domain in
# Coolify bleibt deshalb unverändert.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Zugriffsprotokoll ohne IP-Adresse (auch nicht aus X-Forwarded-For) und ohne
    # Browserkennung: Die App erhebt keine personenbezogenen Daten, das Log auch
    # nicht. Healthchecks von 127.0.0.1 erscheinen nicht.
    map $remote_addr $protokollieren {
        127.0.0.1 0;
        default   1;
    }
    log_format ohne_ip '[$time_local] "$request" $status $body_bytes_sent $request_time';
    access_log /dev/stdout ohne_ip if=$protokollieren;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        # Die Seite ist ~430 KB groß, komprimiert ~250 KB – hilft im Schul-WLAN.
        gzip on;
        gzip_comp_level 6;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_vary on;

        # "no-cache" = Browser fragt jedes Mal kurz nach, ob es eine neue Version gibt.
        # So kommen Änderungen sofort an; unverändert gibt es nur ein kleines "304".
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Unbekannte Pfade (z. B. vertippte Links) landen ebenfalls in der App.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
