server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Die Seite ist ~430 KB groß, komprimiert ~250 KB – hilft im Schul-WLAN.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;

    # "no-cache" = Browser fragt jedes Mal kurz nach, ob es eine neue Version gibt.
    # So kommen Änderungen sofort an; unverändert gibt es nur ein kleines "304".
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Unbekannte Pfade (z. B. vertippte Links) landen ebenfalls in der App.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
